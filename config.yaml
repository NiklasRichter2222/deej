# --- Slider Mapping ---
# Process names are case-insensitive.
# Supported special targets: master, mic, system, deej.current, deej.unmapped.
slider_count: 6
slider_mapping:
  left:
    0: master
    1: deej.current
    2: ts3client_win64.exe
    3: discord.exe
    4:
      - spotify.exe
      - youtube-music-desktop-app.exe
    5: mic
  right:
    0: master
    1: deej.current
    2: ts3client_win64.exe
    3: discord.exe
    4:
      - spotify.exe
      - youtube-music-desktop-app.exe
    5: mic

# --- General Options ---
default_brightness: 0.15
invert_sliders: false
noise_reduction: default

# --- Connection Settings ---
com_port: COM8
baud_rate: 9600

# --- Bidirectional Sync Settings ---
send_on_startup: true
sync_volumes: true

# --- Controller Lighting ---
background_lighting: rgb
color_mapping:
  left:
    color: '#ffffff'
    offcolor: '#ff0000'
    0:
      zero: '#00ffff'
      full: '#ff0000'
    1:
      zero: '#ff7b00'
      full: '#ff7b00'
    2:
      zero: '#00ffee'
      full: '#001eff'
    3:
      zero: '#5662f6'
      full: '#5662f6'
    4:
      zero: '#ff0033'
      full: '#ff0033'
    5:
      zero: '#ff0000'
      full: '#00ff00'
  right:
    color: '#ffffff'
    offcolor: '#00ff00'
    0:
      zero: '#00ffff'
      full: '#ff0000'
    1:
      zero: '#ff7b00'
      full: '#ff7b00'
    2:
      zero: '#00ffee'
      full: '#001eff'
    3:
      zero: '#5662f6'
      full: '#5662f6'
    4:
      zero: '#ff0033'
      full: '#ff0033'
    5:
      zero: '#ff0000'
      full: '#00ff00'
